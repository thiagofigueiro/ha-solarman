#
# Hinen Inverter
#
# Reference: https://github.com/user-attachments/files/17622814/Inverter.Modbus.RTU.Protocol.V1.62.20240927.xlsx
#
# Tested with Hinen H5000-EU Single-Phase Hybrid Model Number: S05U01T00E0FP0500B0500
#

info:
  manufacturer: Hinen
  model: H5000

default:
  update_interval: 30
  code: 0x04
  digits: 4

parameters:
  - group: Device
    update_interval: 5
    items:
      - name: "Device State"
        class: "enum"
        rule: 1
        registers: [0]
        icon: "mdi:state-machine"
        lookup:
          - key: 0
            value: "Stand-by"
          - key: 1
            value: "Grid-connected"
          - key: 2
            value: "Off-grid"
          - key: 3
            value: "FAULT"
          - key: 4
            value: "Update mode"
          - key: 5
            value: "Charging"
          - key: 6
            value: "Discharging"
          - key: 7
            value: "Bypass"

      - name: "Temperature"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: .1
        rule: 2
        registers: [132]

  - group: PV
    update_interval: 5
    items:
      - name: "PV Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: .1
        rule: 2
        registers: [340, 339]
        icon: "mdi:solar-power-variant"

      - name: PV1 Voltage
        alt: DC1 Voltage
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [3]
        icon: "mdi:solar-power-variant"

      - name: PV1 Current
        alt: DC1 Current
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 1
        registers: [4]
        icon: "mdi:solar-power-variant"

      - name: PV1 Power
        alt: DC1 Power
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        registers: [7, 6]
        icon: "mdi:solar-power-variant"

      - name: PV2 Voltage
        alt: DC2 Voltage
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [8]
        icon: "mdi:solar-power-variant"

      - name: PV2 Current
        alt: DC2 Current
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 1
        registers: [9]
        icon: "mdi:solar-power-variant"

      - name: PV2 Power
        alt: DC1 Power
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        registers: [12, 11]
        icon: "mdi:solar-power-variant"

      - name: PV3 Voltage
        alt: DC3 Voltage
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [13]
        icon: "mdi:solar-power-variant"

      - name: PV3 Current
        alt: DC3 Current
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 1
        registers: [14]
        icon: "mdi:solar-power-variant"

      - name: PV3 Power
        alt: DC3 Power
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        registers: [17, 16]
        icon: "mdi:solar-power-variant"

      - name: PV4 Voltage
        alt: DC4 Voltage
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [18]
        icon: "mdi:solar-power-variant"

      - name: PV4 Current
        alt: DC4 Current
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 1
        registers: [19]
        icon: "mdi:solar-power-variant"

      - name: PV4 Power
        alt: DC4 Power
        class: "power"
        state_class: "measurement"
        uom: "W"
        rule: 1
        registers: [22, 21]
        icon: "mdi:solar-power-variant"

  - group: AC
    update_interval: 5
    items:
      - name: Grid Voltage
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [29]

      - name: Grid Current
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 1
        registers: [30]

      - name: Grid Frequency
        class: "frequency"
        state_class: "measurement"
        uom: "Hz"
        scale: .01
        rule: 2
        registers: [56]

      - name: "Load Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: .1
        rule: 2
        registers: [77, 76]

      - name: "Grid Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: .1
        rule: 2
        registers: [26, 25]
        icon: "mdi:transmission-tower"
        description: "Total AC active power of the inverter"

      - name: "Power Factor"
        state_class: "measurement"
        scale: .0001
        offset: 10000
        rule: 1
        registers: [57]
        description: "Power factor offset from 10000 (formula: PF = (raw - 10000) / 10000)"

      - name: "AC Charge Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: .1
        rule: 1
        registers: [107, 106]
        description: "AC power drawn from the grid to charge the battery"

      - name: "Reactive Power"
        class: "reactive_power"
        state_class: "measurement"
        uom: "var"
        scale: .1
        rule: 2
        registers: [28, 27]
        icon: "mdi:transmission-tower"
        description: "Total AC reactive power of the inverter"

      - name: "Apparent Power"
        class: "apparent_power"
        state_class: "measurement"
        uom: "VA"
        scale: .1
        rule: 2
        registers: [24, 23]
        icon: "mdi:transmission-tower"
        description: "Total AC apparent power of the inverter"

      - name: "Grid L1 Voltage"
        entity_category: "diagnostic"
        l: 1
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [31]
        icon: "mdi:transmission-tower"

      - name: "Grid L1 Current"
        entity_category: "diagnostic"
        l: 1
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 2
        registers: [32]
        icon: "mdi:transmission-tower"

      - name: "Grid L1 Active Power"
        entity_category: "diagnostic"
        l: 1
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: .1
        rule: 2
        registers: [34, 33]
        icon: "mdi:transmission-tower"
        description: "R-phase active power"

      - name: "Grid L1 Reactive Power"
        entity_category: "diagnostic"
        l: 1
        class: "reactive_power"
        state_class: "measurement"
        uom: "var"
        scale: .1
        rule: 2
        registers: [36, 35]
        icon: "mdi:transmission-tower"
        description: "R-phase reactive power"

      - name: "Grid L2 Voltage"
        entity_category: "diagnostic"
        l: 2
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [37]
        icon: "mdi:transmission-tower"

      - name: "Grid L2 Current"
        entity_category: "diagnostic"
        l: 2
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 2
        registers: [38]
        icon: "mdi:transmission-tower"

      - name: "Grid L2 Apparent Power"
        entity_category: "diagnostic"
        l: 2
        class: "apparent_power"
        state_class: "measurement"
        uom: "VA"
        scale: .1
        rule: 2
        registers: [40, 39]
        icon: "mdi:transmission-tower"
        description: "S-phase apparent power"

      - name: "Grid L2 Active Power"
        entity_category: "diagnostic"
        l: 2
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: .1
        rule: 2
        registers: [42, 41]
        icon: "mdi:transmission-tower"
        description: "S-phase active power"

      - name: "Grid L2 Reactive Power"
        entity_category: "diagnostic"
        l: 2
        class: "reactive_power"
        state_class: "measurement"
        uom: "var"
        scale: .1
        rule: 2
        registers: [44, 43]
        icon: "mdi:transmission-tower"
        description: "S-phase reactive power"

      - name: "Grid L3 Voltage"
        entity_category: "diagnostic"
        l: 3
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [45]
        icon: "mdi:transmission-tower"

      - name: "Grid L3 Current"
        entity_category: "diagnostic"
        l: 3
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 2
        registers: [46]
        icon: "mdi:transmission-tower"

      - name: "Grid L3 Apparent Power"
        entity_category: "diagnostic"
        l: 3
        class: "apparent_power"
        state_class: "measurement"
        uom: "VA"
        scale: .1
        rule: 2
        registers: [48, 47]
        icon: "mdi:transmission-tower"
        description: "T-phase apparent power"

      - name: "Grid L3 Active Power"
        entity_category: "diagnostic"
        l: 3
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: .1
        rule: 2
        registers: [50, 49]
        icon: "mdi:transmission-tower"
        description: "T-phase active power"

      - name: "Grid L3 Reactive Power"
        entity_category: "diagnostic"
        l: 3
        class: "reactive_power"
        state_class: "measurement"
        uom: "var"
        scale: .1
        rule: 2
        registers: [52, 51]
        icon: "mdi:transmission-tower"
        description: "T-phase reactive power"

      - name: "Grid Voltage RS"
        entity_category: "diagnostic"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [53]
        icon: "mdi:transmission-tower"
        description: "R-S line voltage"

      - name: "Grid Voltage ST"
        entity_category: "diagnostic"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [54]
        icon: "mdi:transmission-tower"
        description: "S-T line voltage"

      - name: "Grid Voltage TR"
        entity_category: "diagnostic"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [55]
        icon: "mdi:transmission-tower"
        description: "T-R line voltage"

      - name: "CT1 Current"
        entity_category: "diagnostic"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 1
        registers: [108]
        description: "CT1 sampling current for external meter"

      - name: "CT2 Current"
        entity_category: "diagnostic"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 1
        registers: [109]
        description: "CT2 sampling current for external meter"

      - name: "CT Status"
        entity_category: "diagnostic"
        class: "enum"
        rule: 1
        registers: [119]
        description: "CT insertion detection status"
        lookup:
          - key: 0
            value: "Not Inserted"
          - key: 1
            value: "Inserted"

  - group: Battery
    update_interval: 5
    items:
      - name: "Battery"
        class: "battery"
        state_class: "measurement"
        uom: "%"
        rule: 1
        registers: [128]
        icon: mdi:home-battery

      - name: "Battery SoH"
        description: Battery state of health
        state_class: "measurement"
        uom: "%"
        rule: 1
        registers: [174]
        icon: mdi:battery-heart

      - name: "Battery Temperature"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: .1
        rule: 1
        registers: [136]
        icon: mdi:thermometer

      - name: "Battery Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [127]
        icon: mdi:flash

      - name: "Battery Discharge Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: .1
        rule: 2
        registers: [103, 102]
        icon: mdi:battery-minus

      - name: "Battery Charge Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: .1
        rule: 2
        registers: [105, 104]
        icon: mdi:battery-plus

      - name: "Battery Combined Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: .1
        rule: 2
        registers: [150, 149]
        icon: "mdi:battery"
        description: "Combined battery power (positive = charge, negative = discharge)"

      - name: "Battery Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 2
        registers: [164]
        icon: "mdi:current-dc"
        description: "Battery current measured by the BMS"

      - name: "BMS Max Charge Current"
        entity_category: "diagnostic"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 1
        registers: [166]
        description: "Maximum charging current allowed by the BMS"

      - name: "BMS Max Discharge Current"
        entity_category: "diagnostic"
        state_class: "measurement"
        uom: "A"
        scale: .1
        rule: 1
        registers: [167]
        description: "Maximum discharging current allowed by the BMS"

      - name: "BMS Gauge Remaining"
        entity_category: "diagnostic"
        state_class: "measurement"
        uom: "Wh"
        rule: 1
        registers: [168]
        description: "BMS reported remaining capacity"

      - name: "BMS Gauge Full Charge Capacity"
        entity_category: "diagnostic"
        state_class: "measurement"
        uom: "Wh"
        rule: 1
        registers: [169]
        description: "BMS reported full charge capacity"

      - name: "BMS Cycle Count"
        entity_category: "diagnostic"
        state_class: "measurement"
        rule: 1
        registers: [173]
        description: "Number of battery charge/discharge cycles"

  - group: Settings
    update_interval: 300
    items:
      - name: "Energy Pattern"
        platform: "select"
        rule: 1
        registers: [125]
        icon: mdi:battery-sync
        lookup:
          - key: 0
            value: "Load"
          - key: 1
            value: "Battery"
          - key: 2
            value: "Grid"
            
      - name: "Battery Control Mode"
        platform: "select"
        rule: 1
        registers: [126]
        icon: "mdi:battery"
        lookup:
          - key: 0x0000
            value: "Lead-Battery"
          - key: 0x0001
            value: "Lithium"

  - group: Info
    update_interval: 3600
    items:
      - name: Battery Software Version
        entity_category: "diagnostic"
        rule: 1
        registers: [170]

      - name: "Master DSP Version"
        entity_category: "diagnostic"
        rule: 1
        registers: [341]
        description: "Master DSP firmware version (major * 100 + minor)"

      - name: "Slave DSP Version"
        entity_category: "diagnostic"
        rule: 1
        registers: [342]
        description: "Slave DSP firmware version (major * 100 + minor)"

      - name: "Total Working Time"
        entity_category: "diagnostic"
        state_class: "total_increasing"
        uom: "s"
        scale: .5
        rule: 1
        registers: [255, 254]
        description: "Total inverter operating time in seconds (register value × 0.5)"

  - group: Diagnostics
    update_interval: 30
    items:
      - name: "IPM Temperature"
        entity_category: "diagnostic"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: .1
        rule: 2
        registers: [133]
        description: "Internal intelligent power module temperature"

      - name: "LLC Temperature"
        entity_category: "diagnostic"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: .1
        rule: 2
        registers: [134]
        description: "Inductor-Inductor-Capacitor resonant converter radiator temperature"

      - name: "Fan Speed"
        entity_category: "diagnostic"
        state_class: "measurement"
        rule: 1
        registers: [135]
        icon: "mdi:fan"
        description: "Internal cooling fan speed"

      - name: "Bus1 Voltage"
        entity_category: "diagnostic"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [130]
        description: "DC bus 1 internal voltage"

      - name: "Bus2 Voltage"
        entity_category: "diagnostic"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [131]
        description: "DC bus 2 internal voltage"

      - name: "Fault Maincode"
        entity_category: "diagnostic"
        class: "enum"
        rule: 1
        registers: [147]
        icon: "mdi:alert-outline"
        description: "Inverter main fault code (0 = no fault)"
        lookup:
          - key: 0
            value: "No Fault"
          - key: default
            value: "Fault"

      - name: "Software Sub Version"
        entity_category: "diagnostic"
        rule: 1
        registers: [121]
        description: "DSP sub-version number"

      - name: "MCU Temperature"
        entity_category: "diagnostic"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: .1
        rule: 2
        registers: [123]
        description: "Monitor board chip temperature"

      - name: "Ambient Temperature"
        entity_category: "diagnostic"
        class: "temperature"
        state_class: "measurement"
        uom: "°C"
        scale: .1
        rule: 2
        registers: [124]
        description: "Monitor board environment temperature"

      - name: "BatVolt DSP"
        entity_category: "diagnostic"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [129]
        description: "Battery voltage sampled by the inverter"

      - name: "LLC Voltage"
        entity_category: "diagnostic"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [137]
        description: "LLC resonant converter voltage"

      - name: "BatPackVolt"
        entity_category: "diagnostic"
        state_class: "measurement"
        uom: "V"
        scale: .1
        rule: 1
        registers: [138]
        description: "Battery pack voltage"

      - name: "Fault Subcode"
        entity_category: "diagnostic"
        rule: 1
        registers: [148]
        description: "Inverter sub-fault code"

      - name: "ISO Resistance"
        entity_category: "diagnostic"
        state_class: "measurement"
        uom: "k\u03A9"
        rule: 1
        registers: [318]
        description: "Insulation resistance value"

      - name: "GFCI"
        entity_category: "diagnostic"
        state_class: "measurement"
        uom: "mA"
        rule: 2
        registers: [319]
        description: "Ground fault circuit interrupter current"

      - name: "Derating Mode Flag"
        entity_category: "diagnostic"
        class: "enum"
        rule: 1
        registers: [153]
        description: "Derating mode indicator"
        lookup:
          - key: 0
            value: "Normal"
          - key: default
            value: "Derating"

      - name: "Power Cos Flag"
        entity_category: "diagnostic"
        class: "enum"
        rule: 1
        registers: [154]
        description: "Power factor leading/lagging indicator"
        lookup:
          - key: 0
            value: "Lagging"
          - key: 1
            value: "Leading"

  - group: Energy
    update_interval: 30
    items:
      - name: "Today Production"
        alt: Daily Production
        friendly_name: Today's Production
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: .1
        rule: 2
        registers: [273, 272]
        icon: "mdi:solar-power"
        validation:
          dev: 100
          invalidate_all:

      - name: "Total Production"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: .1
        rule: 2
        registers: [275, 274]
        icon: "mdi:solar-power"
        validation:
          min: .1
          dev: 100
          invalidate_all: 2

      - name: "PV Year Production"
        alt: "PV Annual Production"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: .1
        rule: 2
        registers: [351, 350]
        icon: "mdi:solar-power"
        validation:
          min: .1
          dev: 100
          invalidate_all: 2
        description: "Annual PV energy production"

      - name: "PV Month Production"
        alt: "PV Monthly Production"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: .1
        rule: 2
        registers: [353, 352]
        icon: "mdi:solar-power"
        validation:
          dev: 100
          invalidate_all:
        description: "Monthly PV energy production"

      - name: "PV1 Today Production"
        alt: "PV1 Daily Production"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: .1
        rule: 2
        registers: [257, 256]
        icon: "mdi:solar-power"
        description: "Daily energy production from PV1 MPPT input"
        validation:
          dev: 100
          invalidate_all:

      - name: "PV1 Total Production"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: .1
        rule: 2
        registers: [259, 258]
        icon: "mdi:solar-power"
        description: "Total energy production from PV1 MPPT input"

      - name: "PV2 Today Production"
        alt: "PV2 Daily Production"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: .1
        rule: 2
        registers: [261, 260]
        icon: "mdi:solar-power"
        description: "Daily energy production from PV2 MPPT input"
        validation:
          dev: 100
          invalidate_all:

      - name: "PV2 Total Production"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: .1
        rule: 2
        registers: [263, 262]
        icon: "mdi:solar-power"
        description: "Total energy production from PV2 MPPT input"

      - name: "PV3 Today Production"
        alt: "PV3 Daily Production"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: .1
        rule: 2
        registers: [265, 264]
        icon: "mdi:solar-power"
        description: "Daily energy production from PV3 MPPT input"
        validation:
          dev: 100
          invalidate_all:

      - name: "PV3 Total Production"
